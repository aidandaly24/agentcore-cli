[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "{{ name }}"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore ~= 1.9.1",
    "botocore[crt] ~= 1.43.0",
    "mcp >= 1.23.0, < 2.0.0",
    {{#if bedrockMantle}}"aws-bedrock-token-generator >= 1.1.0, < 2.0.0",
    {{/if}}"strands-agents{{#if strandsExtras}}[{{strandsExtras}}]{{/if}} ~= 1.54.0",
    {{#if (or hasBrowser hasCodeInterpreter)}}"strands-agents-tools ~= 0.1.0",
    {{/if}}{{#if hasBrowser}}"nest-asyncio ~= 1.5.0",
    "playwright ~= 1.42.0",
    {{/if}}{{#if hasGateway}}{{#if (includes gatewayAuthTypes "AWS_IAM")}}"mcp-proxy-for-aws ~= 1.1.0",
    {{/if}}{{/if}}
]

[tool.hatch.build.targets.wheel]
packages = ["."]
